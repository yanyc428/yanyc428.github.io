<!-- Support for MathJax -->
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>

<!-- Language toggle (the saved choice is applied early in head/custom.html) -->
<script>
  (function () {
    var button = document.getElementById("lang-toggle");
    if (!button) return;
    button.addEventListener("click", function () {
      var lang = document.documentElement.getAttribute("data-lang") === "zh" ? "en" : "zh";
      document.documentElement.setAttribute("data-lang", lang);
      document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
      try { localStorage.setItem("lang", lang); } catch (e) {}
      /* Menu item widths change with the language, so let the greedy nav re-measure. */
      window.dispatchEvent(new Event("resize"));
    });
  })();
</script>

<!-- Visit analytics (GoatCounter): records this page view; dashboard at https://yanyc428.goatcounter.com -->
<script data-goatcounter="https://yanyc428.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<!-- Site-wide visitor total in the footer; the line stays hidden unless the count loads -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var box = document.getElementById("site-visits");
    if (!box || !window.fetch) return;
    fetch("https://yanyc428.goatcounter.com/counter/TOTAL.json")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.count) return;
        document.getElementById("site-visits-count").textContent = data.count;
        box.style.display = "";
      })
      .catch(function () {});
  });
</script>

<!-- end custom footer snippets -->
